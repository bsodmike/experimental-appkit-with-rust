[package]
name = "terminal-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# The pure, headless terminal engine (PRD §2). No FFI and no platform code lives
# here — that is a separate crate — so this one stays testable without a Mac.
[lib]
name = "terminal_core"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
compact_str = "0.8"
nom = "7"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
rstest = "0.23"
