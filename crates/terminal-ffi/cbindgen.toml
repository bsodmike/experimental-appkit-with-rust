language = "C"
header = "/* Generated by cbindgen from terminal-ffi. Do not edit by hand (PRD §14). */"
include_guard = "TERMINAL_H"
tab_width = 4
documentation = true
documentation_style = "doxy"
cpp_compat = true

[export]
prefix = ""

# The Rust name avoids clashing with the engine's own TerminalSize; the C name
# is the one that matters in the header.
[export.rename]
"TerminalSizeC" = "TerminalSize"

[enum]
prefix_with_name = true
