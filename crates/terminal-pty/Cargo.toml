[package]
name = "terminal-pty"
version.workspace = true
edition.workspace = true

# The pseudo-terminal and the child process on the far end of it. POSIX only,
# and deliberately separate from `terminal-core` so the engine keeps no platform
# dependency (PRD §19, crate layout).
[lib]
name = "terminal_pty"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
pty-process = "0.5"
rustix = { version = "1", features = ["event", "pipe", "process", "termios"] }
terminal-core = { path = "../terminal-core" }
