# Crustty configuration.
#
# Copy this to ~/.config/crustty/config and edit. Every setting is optional;
# what is not here keeps its default. Cmd-R reloads the file without relaunching.
#
# A '#' starts a comment only at the beginning of a line, so that colours -- all
# of which begin with '#' -- can be written normally.

# --- Font ------------------------------------------------------------------
# Any installed monospaced font. Unset means the system monospaced font, which
# is always present and always actually monospaced.
# font-family = SF Mono

# Between 6 and 72. Cmd-+ and Cmd-- change it for the session without saving.
# font-size = 13

# --- Colours ---------------------------------------------------------------
# Written as #rrggbb or #rgb.
# background = #1e1e1e
# foreground = #d4d4d4
# cursor-color = #d4d4d4

# The sixteen ANSI colours are palette entries 0-15: black, red, green, yellow,
# blue, magenta, cyan, white, then the same eight again, bright.
# palette-0 = #000000
# palette-1 = #cd3131
# palette-2 = #0dbc79
# palette-3 = #e5e510
# palette-4 = #2472c8
# palette-5 = #bc3fbc
# palette-6 = #11a8cd
# palette-7 = #e5e5e5
# palette-8 = #666666
# palette-9 = #f14c4c
# palette-10 = #23d18b
# palette-11 = #f5f543
# palette-12 = #3b8eea
# palette-13 = #d670d6
# palette-14 = #29b8db
# palette-15 = #ffffff
#
# Entries 16-255 are the 6x6x6 colour cube and the greyscale ramp, and can be
# set the same way -- but they are computed by a formula every terminal shares,
# so a program drawing a gradient will look wrong against anything else.

# --- Shell -----------------------------------------------------------------
# Unset means $SHELL, and /bin/zsh if even that is unset.
# shell = /opt/homebrew/bin/fish

# The arguments it starts with. The default is a single -l, because an app
# bundle inherits a stub PATH and only the login profile rebuilds it. Setting
# any shell-arg replaces that default rather than adding to it.
# shell-arg = -l

# --- Keyboard --------------------------------------------------------------
# Whether Option is Meta: Option+B sends ESC B, rather than the character the
# keyboard layout would produce. True is what a terminal is for; false is what
# someone typing a language that needs Option is after.
# option-is-meta = true

# --- Logging ---------------------------------------------------------------
# Write a trace of the whole loop -- bytes read from the shell, commands the
# parser decoded, cells the screen wrote, each time the UI was woken, each
# frame copied -- to this directory. One file per run, plus a latest.log
# symlink. Unset means no logging at all.
#
# `just run` sets CRUSTTY_LOG_DIR to ./logs, which does the same thing without
# editing this file. Set RUST_LOG to change the level from the default of info.
# log-dir = /Users/you/.local/state/crustty

# --- Window ----------------------------------------------------------------
# The size the window opens at, in cells. Changing these affects the next
# launch, not the running window.
# window-rows = 24
# window-cols = 80
